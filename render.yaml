services:
  - type: web
    name: alfadiagnostic-al
    runtime: docker
    plan: starter
    buildCommand: docker build -t alfadiagnostic .
    startCommand: docker run -p $PORT:8080 alfadiagnostic
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alfadiagnostic-db
          property: connectionString
      - key: ADMIN_PASSCODE
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: alfadiagnostic-db
    plan: basic-256mb
    databaseName: alfadiagnostic
    user: alfadiagnostic
